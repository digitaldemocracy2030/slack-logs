name: slack-mirror

on:
  schedule:
    - cron: '7 */6 * * *'   # 6時間ごと (0:07, 6:07, 12:07, 18:07 UTC)
  workflow_dispatch:
    inputs:
      window_days:
        description: 'ミラーする過去日数（デフォルト75）。canonical(月次・約2ヶ月遅延)と常時オーバーラップさせ隙間を0にする'
        required: false
        default: '75'

concurrency:
  group: slack-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install slack_sdk==3.*

      - name: Run mirror
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          WINDOW_DAYS: ${{ inputs.window_days || '75' }}
          SKIP_CHANNELS: ${{ vars.SKIP_CHANNELS }}
          OUT_DIR: mirror
        run: python scripts/slack_mirror.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'dd2030-slack-logs-bot'
          git config user.email 'bot@dd2030.invalid'
          git add -A mirror
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          # sync.json から要約 (channel_count / message_count) を取って commit message に
          msg=$(jq -r '"slack mirror synced_at=\(.synced_at) channels=\(.channel_count) messages=\(.message_count)"' mirror/sync.json)
          git commit -m "$msg"
          # push がコケたら rebase しない。mirror/ は毎回フル上書きのスナップショットで、
          # 相手 run の内容とマージする意味がない（バイナリ .jsonl.gz は rebase 不能で必ず conflict する）。
          # 代わりに最新 main の上へ自分のスナップショットを載せ直す（ours が勝つ）。
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push attempt $attempt rejected; replaying snapshot onto latest main"
            git fetch origin main
            git reset --soft FETCH_HEAD
            git add -A mirror
            if git diff --cached --quiet; then
              echo "mirror already up to date on main, nothing to push"
              exit 0
            fi
            git commit -m "$msg"
            sleep $((attempt * 3))
          done
          echo "::error::push failed after 5 attempts"
          exit 1

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `slack-mirror failed at ${new Date().toISOString()}`,
              body: `Mirror workflow run failed.\n\n- run: ${runUrl}`,
              labels: ['slack-mirror', 'failure'],
            });
